global:
  scrape_interval: 15s      # 15초마다 메트릭 수집
  scrape_timeout: 10s       # [Add] 수집 타임아웃 명시 (기본값과 동일하지만 명확화)

scrape_configs:
  - job_name: 'board-api-spring-boot'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # Docker 컨테이너 → 호스트 머신의 Spring Boot 접근
      # Mac/Windows: host.docker.internal 사용
      # Linux: docker-compose extra_hosts에서 host-gateway로 해석
      - targets: ['host.docker.internal:8080']