spring:
  profiles:
    active: local

  datasource:
    url: jdbc:mysql://localhost:3306/board_db?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: Qudcjs5027!
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: false

  # Redis 연결 설정
  data:
    redis:
      host: localhost
      port: 6379

  # 캐시 구현체를 Redis로 명시
  cache:
    type: redis

jwt:
  secret: board-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
  expiration-ms: 86400000  # 24시간

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus

logging:
  level:
    root: INFO
    com.board: DEBUG
    org.springframework.cache: TRACE