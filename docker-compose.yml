services:

  # ======================== ELK Stack ========================

  elasticsearch:
    # [Fix] latest 태그 제거 → 버전 고정 (예측 가능한 환경 유지)
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    # [Add] 데이터 영속화: 컨테이너 삭제해도 색인 데이터 유지
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - elk_network
    ports:
      - "9200:9200"
    # [Add] 헬스체크: Logstash/Kibana가 실제 준비된 후 연결하도록 보장
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # [Add] 재시작 정책
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:9.1.0
    container_name: logstash
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    volumes:
      - ./logs:/usr/share/logstash/logs
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf
      # [Add] sincedb 볼륨화: 컨테이너 재생성 후에도 읽은 파일 위치 기억
      - logstash_sincedb:/usr/share/logstash/sincedb
    ports:
      - "5044:5044"
    # [Fix] depends_on + condition: Elasticsearch가 준비된 후 시작
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elk_network
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:9.1.0
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elk_network
    restart: unless-stopped

  # ======================== Monitoring Stack ========================

  prometheus:
    # [Fix] latest → 버전 고정
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      # [Add] 메트릭 데이터 영속화
      - prometheus_data:/prometheus
    # [Add] Linux에서 host.docker.internal 동작하도록 추가
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring_network
    restart: unless-stopped

  grafana:
    # [Fix] latest → 버전 고정
    image: grafana/grafana:11.4.0
    container_name: grafana
    ports:
      - "3000:3000"
    # [Add] 대시보드/데이터소스 설정 영속화
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring_network
    restart: unless-stopped

# ======================== Named Volumes ========================
# [Add] 모든 영속 데이터를 Named Volume으로 관리
volumes:
  es_data:
  logstash_sincedb:
  prometheus_data:
  grafana_data:

# ======================== Networks ========================
networks:
  elk_network:
    driver: bridge
  monitoring_network:
    driver: bridge