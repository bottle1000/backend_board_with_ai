# ============================================================
# Logstash Pipeline Configuration
# [Fix] 구조화 JSON 로깅 도입으로 Grok 파싱 제거
# [Fix] start_position: end (재시작 시 중복 색인 방지)
# [Fix] sincedb_path 볼륨 마운트 경로로 명시
# [Fix] stdout rubydebug 제거 (처리량 낭비 방지)
# ============================================================

# 1. Input
input {
  file {
    path => "/usr/share/logstash/logs/*.log"

    # [Fix] beginning → end: 새로 추가되는 로그만 읽음
    start_position => "end"

    # [Fix] 볼륨에 sincedb 저장 → 컨테이너 재생성 후에도 읽은 위치 기억
    sincedb_path => "/usr/share/logstash/sincedb/.sincedb"

    # [Fix] multiline + Grok 제거 → JSON codec으로 단순화
    #       LogstashEncoder가 스택트레이스도 JSON 한 줄로 직렬화하므로 multiline 불필요
    codec => json
  }
}

# 2. Filter
# LogstashEncoder가 @timestamp, level, message, traceId 등을 이미 JSON으로 포함
# 별도 가공 불필요 → filter 블록 제거

# 3. Output
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    # 날짜별 인덱스 분리 → Kibana에서 기간별 조회 용이
    index => "board-api-logs-%{+YYYY.MM.dd}"
    action => "index"
  }

  # [Fix] stdout rubydebug 제거
  #       운영에서 모든 로그를 Logstash 콘솔에 재출력하는 성능 낭비 제거
  #       디버깅이 필요할 때만 아래 주석 해제
  # stdout { codec => rubydebug }
}