# Logstash Pipeline Configuration

# 1. Input: 로그 파일 읽기
input {
  file {
    path => "/usr/share/logstash/logs/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }
}

# 2. Filter: 로그 파싱
filter {
  grok {
    match => {
      "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level}\s+\[%{DATA:traceId}\] %{DATA:logger} : %{GREEDYDATA:log_message}"
    }
  }
}

# 3. Output: Elasticsearch로 전송
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "board-api-logs-%{+YYYY.MM.dd}"
  }

  # 디버깅용: Logstash 콘솔에도 출력
  stdout { codec => rubydebug }
}